 papal_occupacy_title:0 "Papal state"
 papal_occupacy_desc:0 "The deep devotion of the Roman Catholics in Ravenna has awakened a desire for an independent state ruled by Popes of the Church. A large part of the population has expressed support for the idea of such an establishment and has now turned to $MONARCH$ for approval."
 papal_occupacy_first:0 "We will never support such a state"
 papal_occupacy_second:0 "Ravenna is rightfully theirs"