### P10 - Albanord ###
P10_ideas_start:0 "Albanorman traditions"
P10_ideas:0 "Albanorman ideas"
P10_home_in_hills:0 "Home in hills"
P10_arctic_roots:0 "Arctic roots"
P10_king_of_alba:0 "King of Alba"
P10_seasoned_seafarers:0 "Seasoned seafarers"
P10_white_gold_of_seas:0 "White gold of seas"
P10_north_sea_merchants:0 "North sea merchants"
P10_laeviathan:0 "Laeviathan"

P10_home_in_hills_desc:0 "First capital of our country was just a small settlements in the middle of hills. After years, we adopted local techniques of highland agriculture and building and made our home in to a place befitting of a King."
P10_arctic_roots_desc:0 "Before we came here, we were just a humble seal hunters in Iceland. Years spent in the far north made us accustomed to harsh living conditions."
P10_king_of_alba_desc:0 "Once just a Jarl, now a King of whole Alba, our ruler bases his power on loyal servants and huscarls. They are not just nords, but Picts and anglosaxons too. Everyone is welcome in our court, as long as they stay loyal to only one King."
P10_seasoned_seafarers_desc:0 "Among our Sagas, there are many seafarers, who earned their place by amazing voyages, such as Leif Eriksson or Thorfin Karlsenfi."
P10_white_gold_of_seas_desc:0 "One of crucial goods in northern trade are products of whale hunting. Be it whale oil or narwhals' tusks, everything we get, from the seabeast can be turned into gold on southern markets."
P10_north_sea_merchants_desc:0 "With discovery of Vinland and other lands in New World, North sea became home to many merchants. We can utilise them to strenghten economic base of our country." 
P10_laeviathan_desc:0 "When our ships reached european coasts, they were dubbed as 'laeviathans'. After questioning captured monks, it came out that this name means legendary seabests, which fits our mighty ships perfectly."

 ### P13 - British Order ###
P13_ideas_start:0 "Georgian tradition"
P13_ideas_bonus:0 "Georgian ambition"
P13_ideas:0 "Georgian ideas"
P13_promised_land:0 "Promised lands."
P13_promised_land_desc:0 "This land was promised to us 3000 years ago. Also pope said so."
P13_holy_renoma:0 "Holy renoma."
P13_holy_renoma_desc:0 "We are crusader order. Our fame reach far and wide. Everyone want to join our ranks. Everyone wants to be one of us."
P13_pope_likes_us:0 "Pope likes us."
P13_pope_likes_us_desc:0 "*Sounds of slaughtered pagans*"
P13_to_the_work:0 "To the work!"
P13_to_the_work_desc:0 "To the work, one slogan as a command remember, to the work."
P13_armour:0 "Armour!"
P13_armour_desc:0 "Lord, you gave me an armour, old blacksmith made it, bend in manny battles, soaked in many ppls blood."
P13_culture_changes:0 "Cultures come and fade!"
P13_culture_changes_desc:0 "Thats how the world looks like, cultures come, evolve, divide, go and come back. However we can help to speed up this process."
P13_loyal_states:0 "Loyal estates!"
P13_loyal_states_desc:0 "Our cause, our mission, our job. Those world unite people, we can see that the future is tied to all of us and dividing wont bring any good to our lands."