### A07 - Canari Pirates ###
A07_ideas:0 "Canarian ideas"
A07_ideas_start:0 "Canarian traditions"
A07_ideas_bonus:0 "Canarian ambition"
A07_you_are_a_pirate:0 "You are a pirate!"
A07_you_are_a_pirate_desc:0 "Do what you want 'cause a pirate is free, you are a pirate! Yar har fiddle-dee-dee, being a pirate is alright with me! Do what you want 'cause a pirate is free, you are a pirate! You are a pirate! (Yay!)"
A07_settelements:0 "Canarian settlers"
A07_settelements_desc:0 "Canarian people are born explorers and settlers. Way of life demands from them quickly accomodate to hars enviroments."
A07_i_am_a_road_pirate:0 "I am a road pirate!"
A07_i_am_a_road_pirate_desc:0 "i am a road pirate, i smoke rubber hit the gas, I am road pirate full speed no time to worry, (lalalalalalala)"
A07_promote_de_trade:0 "Promote the trade."
A07_promote_de_trade_desc:0 "Pirates have an amazing strategy to guide merchant’s ships to certain routes, cities and factories. Mainly its the onboard guns and saber in hand."
A07_pirates_codex:0 "Pirates' codex"
A07_pirates_codex_desc:0 "Pirates live by the laws. They might be “taken under the law” but this phrase matters only to the outside countries. Here, we got our own laws. Pirates have to obey them or face a penalty. We are not anarchist savages, many of our laws are wayyy ahead of any other countries."
A07_worrior:0 "Worrior!"
A07_worrior_desc:0 "Ready to fight, you got the power, skill to survive. Warrior, aim for the kill. Nothing can stop you, cant break the wheel."
A07_pirates_solidarity:0 "Pirates's solidarity"
A07_pirates_solidarity_desc:0 "We take pride in being who we are, we have eyes and ears all around and every new face is very quickly spotted. Our people value this way of life and they will make that state of matter last."

### I01 - Brittany ###
I01_ideas:0 "Breton ideas"
I01_ideas_start:0 "Breton traditions"
I01_ideas_bonus:0 "Breton ambition"
I01_infantry_power_ideas:0 "Breton infantry."
I01_infantry_power_ideas_desc:0 "As a mostly coastal nation our people are sea hardened worriors. Raised with the salmon and sea breezes, they are no match for any of our neighbours."
I01_diplomatic_ideas:0 "Diplomacy."
I01_diplomatic_ideas_desc:0 "Diplomacy is very funny thing. We said to one guy not to shit himself once and well, our diplomat had to find quick transport in a very short amount of time."
I01_country_legitimacy:0 "Country legitimacy."
I01_country_legitimacy_desc:0 "Every rule has to be justified, has to have required legitimacy to hold that rule, to let the people to be ruled. We understand that very well, our leaders have every right to carry that glorious title."
I01_seas:0 "High seas."
I01_seas_desc:0 "They didnt lie, those seas are really high (over 4 meters tall). Water, water and water, nothing more and nothing less. For our people ships are not a second home, but rather the first home and the lands is the second."
I01_trade_range:0 "Range of trade."
I01_trade_range_desc:0 "Itsa long way from home, my dude. Long way from home."
I01_imperial_ideas:0 "Imperial leverage."
I01_imperial_ideas_desc:0 "We have our ways to convince people to our cause. We know how to do the politics."
I01_manpower:0 "Manpower."
I01_manpower_desc:0 "There is not such thing like too much man. "

