 akritai_estate: "Akritai"
 akritai_estate_desc: "Akritai were soldiers guarding empire's eastern frontier against persian and muslim attacks. They consisted of light infantry recruited from Byzantine and Armenian population. After Gavras dynasty seized Imperial throne, Akritai secured many new privileges and evloved into warrior-nobility estate, which is now main force in the frontier."

