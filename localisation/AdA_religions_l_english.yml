 wulfic:0 "Wulfism"
 wulfic_religion_desc:0 "Wulfism is ofshoot of Catholic Christianity, born in the first half of 16th century, with the teachings of burgundian missionary Wulfric. It merges Christian core with several pagan traditions, such as slavic cult of nature and attribuntion of Nordic gods to biblical characters."

 penitent:0 "Penitentialism"
 penitent_religion_desc:0 "Penitentialism is extremist Christian denomination, having its roots in 13th century Italy. Main dogma of this branch is perpetual sin of christianity, from which humans can only escape by pain. It made comeback when christianity once again fallen in crisis in 16th century."
