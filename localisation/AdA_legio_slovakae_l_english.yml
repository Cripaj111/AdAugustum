l_english: 
 legio_slovakae.0001.t:0 "A cave in the mountains."
 legio_slovakae.0001.d:0 "Vaclav Farkas cursed quietly. It was fifth day of his visitation of norther fortresses. It was also fifth day of soaking rain, which seemed like pouring from all directions at once. They left previous fort yesterday morning and everything  what had time to dry, was wet again. \n Visitation was smooth, commandant of the fort, Tomas, was old friend of his, solid and loyal soldier, a little grumpy but honest and brave. \n Another blow of wind shaken Vaclav from the memories of past duty with Tomas and forced him to shake excess water from the helmet. They still had a slightly over full day of a journey to their next stop, and it was counted during good weather. \n ***************************** \n Wind was howling and blowing, each time with slightly more strength. Vaclav and his men should have already find their place for the night but approaching storm crossed their plans. About an hour ago they entered hills, hoping to find cover from the weather, and rain was indeed not that strong, that wind, was twice as strong. And it was getting dark.\n Then one soldier shouted “Cave, i see a cave!” Indeed after a few steps Vaclav saw a cave. Orders were quick, we stop there for the night, lit the fire (it was not that easy after the rain) and we will continue our journey tomorrow. \n When morning came Vaclav was not that well slept as he intended, whole night something was chafing him in the back and arm. After the awakening an officer come to him and inspected what it might be. Something was sticking out of the ground. “It looks like … a roman sword”"
 legio_slovakae.0001.a:0 "Roman, you say?"
 legio_slovakae.0001.b:0 "Another rubbish, put it in museum or something."

 legio_slovakae.0002.t:0 "History speaks for itself."
 legio_slovakae.0002.d:0 ""
 legio_slovakae.0002.a:0 "I got an idea, you know?"
 legio_slovakae.0002.b:0 "Interesting, yes, but who cares???"

 legio_slovakae.0003.t:0 "Legio Slovakae."
 legio_slovakae.0003.d:0 ""
 legio_slovakae.0003.a:0 "Lets establish the Legion."
 legio_slovakae.0003.b:0 "Another Roman fanboy, pathetic."
